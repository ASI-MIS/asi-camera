<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASI Face Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(160deg,#05081a,#0a0f2b 55%,#0f1740);
  color:#eaf1ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;}
.wrap{width:100%;max-width:430px;text-align:center;}
.brand{font-family:'Sora';font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#38bdf8;font-weight:800;margin-bottom:6px;}
h1{font-family:'Sora';font-size:21px;font-weight:800;margin-bottom:16px;letter-spacing:.4px;}
.stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;
  background:#070b1f;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 70px -28px rgba(0,0,0,.9);}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
.ring{position:absolute;inset:11%;border-radius:50%;border:3px dashed rgba(56,189,248,.5);pointer-events:none;transition:.3s;}
.ring.good{border-style:solid;border-color:#34d399;box-shadow:0 0 34px rgba(52,211,153,.6),inset 0 0 34px rgba(52,211,153,.22);}
.ring.bad{border-color:rgba(251,113,133,.6);}
.shot{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.shot.on{animation:flash .45s ease;}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.dots{display:flex;gap:9px;justify-content:center;margin:15px 0 4px;}
.dot{width:38px;height:6px;border-radius:4px;background:rgba(255,255,255,.14);transition:.3s;}
.dot.on{background:linear-gradient(90deg,#34d399,#22d3ee);box-shadow:0 0 14px rgba(52,211,153,.8);}
.msg{margin-top:14px;font-size:14.5px;font-weight:700;line-height:1.6;min-height:46px;color:#cfe0ff;}
.msg b{color:#7dd3fc;}
.msg.err{color:#fda4af;}
.msg.ok{color:#6ee7b7;}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:12px;display:none;}
.bar.on{display:block;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#6366f1);transition:width .3s;}
button{width:100%;margin-top:16px;padding:15px;border:none;border-radius:14px;cursor:pointer;
  font-family:'Sora';font-weight:800;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;
  background:linear-gradient(135deg,#38bdf8,#3b82f6 45%,#6366f1);color:#fff;
  box-shadow:0 16px 36px -14px rgba(59,130,246,.9);transition:.2s;}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07);}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;}
button.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  box-shadow:none;color:#93a0ce;margin-top:9px;}
.note{margin-top:13px;font-size:11px;color:#6b78a8;line-height:1.6;}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">Anand Sports Industries</div>
  <h1 id="ttl">😊 Face Login</h1>

  <div class="stage">
    <video id="vid" autoplay muted playsinline></video>
    <div class="ring" id="ring"></div>
    <div class="shot" id="shot"></div>
  </div>

  <div class="dots" id="dots"></div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div class="msg" id="msg">Camera shuru ho raha hai…</div>

  <button id="btn" disabled>⏳ Loading…</button>
  <button class="ghost" onclick="bail('user_cancel')">✕ Cancel</button>

  <div class="note" id="note">Face saaf roshni me rakho · chashma utar lo to behtar<br>Photo kahin save nahi hoti — sirf face ka number code jata hai</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script>
/* =======================================================================
   ASI FACE CAMERA  —  SAMAIRA CRM ke liye
   URL: camera.html?mode=enroll   (3 sample lega — face register karne ke liye)
        camera.html?mode=verify   (1 sample lega — login ke liye)
   Wapas bhejta hai (postMessage -> window.opener):
     { source:'ASI_FACE_CAM', v:1, ok:true, mode:'enroll'|'verify',
       descriptors:[[128 numbers], ...] }
     ya  { source:'ASI_FACE_CAM', v:1, ok:false, error:'...' }
   ======================================================================= */

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
const MODE      = (new URLSearchParams(location.search).get('mode') || 'verify').toLowerCase();
const NEED      = (MODE === 'enroll') ? 3 : 1;     // kitne sample lene hain
// LOGIN (verify) me face aate hi apne aap scan — band karna ho to URL me &auto=0
const AUTO      = (MODE === 'verify') &&
                  ((new URLSearchParams(location.search).get('auto') || '1') !== '0');
const AUTO_HOLD = 3;    // itne frame tak face tikna chahiye (~1.2 sec) tab scan
const MIN_FACE  = 0.17; // face itna bada ho (video ki chaudai ka hissa) — door se scan na ho

const vid=document.getElementById('vid'), ring=document.getElementById('ring');
const msg=document.getElementById('msg'), btn=document.getElementById('btn');
const dots=document.getElementById('dots'), bar=document.getElementById('bar'), barFill=document.getElementById('barFill');
const shot=document.getElementById('shot');

let stream=null, ready=false, busy=false, sent=false;
const got=[];

document.getElementById('ttl').innerText = (MODE==='enroll') ? '🙂 Face Register Karo' : '😊 Face Login';
if(AUTO){
  const nt=document.getElementById('note');
  if(nt)nt.innerHTML='⚡ <b style="color:#6ee7b7">Auto scan ON</b> — button dabane ki zaroorat nahi, bas face dikhao'
    +'<br>Face saaf roshni me rakho · Photo kahin save nahi hoti, sirf number code jata hai';
}

// progress dots
for(let i=0;i<NEED;i++){ const d=document.createElement('div'); d.className='dot'; dots.appendChild(d); }
function paintDots(){ [...dots.children].forEach((d,i)=>d.classList.toggle('on', i<got.length)); }

function say(t,cls){ msg.className='msg'+(cls?' '+cls:''); msg.innerHTML=t; }

function send(payload){
  if(sent)return; sent=true;
  const data=Object.assign({source:'ASI_FACE_CAM', v:1, mode:MODE}, payload);
  try{ if(window.opener) window.opener.postMessage(data,'*'); }catch(e){}
  try{ if(window.parent && window.parent!==window) window.parent.postMessage(data,'*'); }catch(e){}
  stopCam();
  setTimeout(function(){ try{ window.close(); }catch(e){} },700);
}
function bail(reason){ send({ok:false, error:reason||'cancelled'}); }
function stopCam(){ try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(e){} }

// ---------- models + camera ----------
(async function init(){
  try{
    say('Face model load ho raha hai… <b>pehli baar thoda time lagega</b>');
    bar.classList.add('on'); barFill.style.width='15%';

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);      barFill.style.width='40%';
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);     barFill.style.width='60%';
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);    barFill.style.width='100%';
    setTimeout(()=>bar.classList.remove('on'),400);

    say('Camera on kar rahe hain…');
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:640}, height:{ideal:640} }, audio:false
    });
    vid.srcObject = stream;
    await vid.play();

    ready=true;
    btn.disabled=false;
    btn.innerText = (MODE==='enroll') ? '📸 Capture (1/'+NEED+')'
                  : (AUTO ? '📸 Manual Scan' : '📸 Face Scan Karo');
    say((MODE==='enroll')
      ? 'Face ko circle ke andar rakho aur <b>'+NEED+' baar</b> capture karo'
      : (AUTO ? 'Face ko circle ke andar laao — <b>apne aap scan</b> ho jayega'
              : 'Face ko circle ke andar rakho, phir <b>Face Scan</b> dabao'));
    watch();

  }catch(err){
    bar.classList.remove('on');
    const m=String(err&&err.name||err);
    if(m.indexOf('NotAllowed')>=0 || m.indexOf('Permission')>=0){
      say('❌ Camera ki permission nahi mili.<br>Browser me camera <b>Allow</b> karo aur page refresh karo.','err');
    }else if(m.indexOf('NotFound')>=0){
      say('❌ Is device par camera nahi mila.','err');
    }else{
      say('❌ '+m,'err');
    }
    btn.innerText='↻ Dobara Try Karo';
    btn.disabled=false;
    btn.onclick=()=>location.reload();
  }
})();

// ---------- live face guide ----------
const OPT = new faceapi.TinyFaceDetectorOptions({ inputSize:320, scoreThreshold:0.45 });
let streak=0;

async function watch(){
  if(!ready || sent) return;
  if(!busy){
    try{
      const d = await faceapi.detectSingleFace(vid, OPT);
      const vw = vid.videoWidth || 640;
      const big = d ? ((d.box.width / vw) >= MIN_FACE) : false;
      ring.className = 'ring ' + (d ? (big ? 'good' : 'bad') : 'bad');

      if(AUTO){
        if(d && big){
          streak++;
          const left = AUTO_HOLD - streak;
          if(left > 0){
            say('🙂 Face mil gaya — hilna mat… <b>' + left + '</b>', 'ok');
            btn.innerText = 'Scan ho raha hai… ' + left;
          }else{
            streak = 0;
            doCapture();          // apne aap scan
            return;
          }
        }else{
          if(streak > 0){ streak = 0; btn.innerText = '📸 Manual Scan'; }
          say(d ? 'Thoda paas aao — face bada dikhna chahiye'
                : 'Face ko circle ke andar laao — <b>apne aap scan</b> ho jayega');
        }
      }
    }catch(e){}
  }
  setTimeout(watch, 420);
}

// ---------- capture ----------
btn.onclick = function(){ doCapture(); };

async function doCapture(){
  if(!ready || busy || sent) return;
  busy=true; btn.disabled=true;
  const old=(MODE==='enroll') ? ('📸 Capture ('+(got.length+1)+'/'+NEED+')')
                              : (AUTO ? '📸 Manual Scan' : '📸 Face Scan Karo');
  btn.innerText='⏳ Scan ho raha hai…';
  say('Hilna mat… face padha ja raha hai');

  try{
    const res = await faceapi
      .detectSingleFace(vid, OPT)
      .withFaceLandmarks()
      .withFaceDescriptor();

    if(!res){
      say('⚠ Face nahi mila — roshni me aao aur camera ke saamne seedha dekho','err');
      busy=false; btn.disabled=false; btn.innerText=old;
      streak=0;            // auto mode me dobara apne aap koshish karega
      return;
    }

    shot.classList.remove('on'); void shot.offsetWidth; shot.classList.add('on');
    got.push(Array.from(res.descriptor).map(n=>Math.round(n*100000)/100000));
    paintDots();

    if(got.length < NEED){
      say('✔ <b>'+got.length+'/'+NEED+'</b> ho gaya — thoda angle badlo aur phir capture karo','ok');
      btn.innerText='📸 Capture ('+(got.length+1)+'/'+NEED+')';
      busy=false; btn.disabled=false;
      return;
    }

    say('✅ Ho gaya! Window apne aap band ho rahi hai…','ok');
    btn.innerText='✅ Done';
    send({ok:true, descriptors:got});

  }catch(err){
    say('❌ '+String(err&&err.message||err),'err');
    busy=false; btn.disabled=false; btn.innerText=old;
  }
}

// window band karo to parent ko pata chale
window.addEventListener('beforeunload', function(){ if(!sent) bail('window_closed'); });
</script>
</body>
</html>
